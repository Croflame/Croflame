<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VK Messenger Hybrid</title>
  <style>
    /* --- VK BASE STYLES & VARIABLES --- */
    :root {
      --vk-blue: #0077ff;
      --vk-blue-hover: #0066cc;
      --vk-bg: #edf0f5;
      --vk-card-bg: #ffffff;
      --vk-text-primary: #000000;
      --vk-text-secondary: #818c99;
      --vk-border: #e7e8ec;
      --vk-header-height: 48px;
      --chat-bg: #e5ddd5; /* WhatsApp default chat tone */
    }

    [data-theme="dark"] {
      --vk-bg: #0a0a0c;
      --vk-card-bg: #19191a;
      --vk-text-primary: #e1e3e6;
      --vk-text-secondary: #76787a;
      --vk-border: #2c2d2e;
      --chat-bg: #0b141a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "VK Sans Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--vk-bg); color: var(--vk-text-primary); display: flex; height: 100vh; overflow: hidden; }

    /* --- LAYOUT: DISCORD + TG + VK HYBRID --- */
    #app-container { display: flex; width: 100vw; height: 100vh; }

    /* Left Nav Rail (Discord Servers / VK Quick Nav) */
    .vk-rail {
      width: 64px;
      background: var(--vk-card-bg);
      border-right: 1px solid var(--vk-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 12px;
      z-index: 10;
    }
    .rail-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--vk-bg); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease; border: none; fill: var(--vk-text-secondary);
    }
    .rail-btn:hover, .rail-btn.active { background: var(--vk-blue); fill: #fff; border-radius: 14px; }

    /* Middle Panel: Chats, Search & Favorites */
    .vk-sidebar {
      width: 320px;
      background: var(--vk-card-bg);
      border-right: 1px solid var(--vk-border);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid var(--vk-border);
    }
    .search-box {
      position: relative;
      width: 100%;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border-radius: 8px;
      border: 1px solid var(--vk-border);
      background: var(--vk-bg);
      color: var(--vk-text-primary);
      outline: none;
    }
    .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); fill: var(--vk-text-secondary); width: 18px; height: 18px; }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-item {
      display: flex; align-items: center; padding: 10px 12px; gap: 12px;
      cursor: pointer; transition: background 0.15s ease; border-bottom: 1px solid rgba(0,0,0,0.02);
    }
    .chat-item:hover, .chat-item.active { background: rgba(0, 119, 255, 0.08); }
    .avatar-wrapper { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
    .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .status-indicator { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: #4bb34b; border: 2px solid var(--vk-card-bg); border-radius: 50%; }
    
    .chat-info { flex: 1; min-width: 0; }
    .chat-name-row { display: flex; align-items: center; gap: 4px; }
    .chat-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .verified-badge { fill: var(--vk-blue); width: 16px; height: 16px; flex-shrink: 0; }
    .custom-status-icon { width: 16px; height: 16px; border-radius: 3px; object-fit: cover; }
    .chat-last-msg { font-size: 12px; color: var(--vk-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    /* Main Chat Window */
    .vk-chat-window {
      flex: 1; display: flex; flex-direction: column; background-color: var(--vk-bg); position: relative;
    }
    .chat-header {
      height: var(--vk-header-height); background: var(--vk-card-bg);
      border-bottom: 1px solid var(--vk-border); display: flex; align-items: center;
      padding: 0 16px; justify-content: space-between; z-index: 5;
    }
    .chat-header-user { display: flex; align-items: center; gap: 10px; }

    .chat-messages {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
      background-size: cover; background-position: center; position: relative;
    }
    /* WhatsApp Pattern Overlay Simulation */
    .chat-messages::before {
      content: ''; position: absolute; top:0; left:0; right:0; bottom:0;
      background-image: radial-gradient(var(--vk-text-secondary) 0.5px, transparent 0.5px);
      background-size: 16px 16px; opacity: 0.1; pointer-events: none;
    }

    .message-bubble {
      max-width: 65%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4;
      position: relative; word-wrap: break-word; z-index: 2; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .message-bubble.incoming { background: var(--vk-card-bg); align-self: flex-start; border-bottom-left-radius: 2px; }
    .message-bubble.outgoing { background: var(--vk-blue); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .message-bubble.sticker { background: transparent !important; box-shadow: none !important; padding: 0; }
    .message-bubble.sticker img { max-width: 160px; max-height: 160px; object-fit: contain; }
    .message-media { max-width: 100%; border-radius: 8px; margin-top: 4px; }
    .inline-emoji { width: 20px; height: 20px; vertical-align: middle; }

    /* Input Area */
    .chat-input-area {
      padding: 12px; background: var(--vk-card-bg); border-top: 1px solid var(--vk-border);
      display: flex; align-items: center; gap: 8px; z-index: 5;
    }
    .input-wrapper { flex: 1; display: flex; align-items: center; background: var(--vk-bg); border-radius: 20px; padding: 4px 12px; border: 1px solid var(--vk-border); }
    .input-wrapper input { flex: 1; border: none; background: transparent; padding: 8px; outline: none; color: var(--vk-text-primary); }

    .action-btn { background: none; border: none; cursor: pointer; fill: var(--vk-text-secondary); display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 50%; }
    .action-btn:hover { background: rgba(0,0,0,0.05); fill: var(--vk-blue); }

    /* Custom Panels / Modals */
    .panel-overlay {
      position: absolute; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .panel-card {
      background: var(--vk-card-bg); width: 480px; max-width: 90vw; max-height: 85vh; border-radius: 12px;
      border: 1px solid var(--vk-border); display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--vk-border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
    .panel-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    /* Nitro/TG Premium Banner Customizer */
    .profile-banner-preview { height: 80px; border-radius: 8px; background: linear-gradient(135deg, var(--vk-blue), #9c27b0); position: relative; margin-bottom: 30px; }
    .profile-avatar-preview { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--vk-card-bg); position: absolute; bottom: -20px; left: 16px; object-fit: cover; }

    textarea.css-editor { width: 100%; height: 160px; background: #1e1e1e; color: #00ff66; font-family: monospace; padding: 10px; border-radius: 8px; border: none; resize: vertical; }

    /* Nitro/Premium Badges */
    .role-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(0, 119, 255, 0.1); color: var(--vk-blue); font-weight:bold; }
  </style>

  <!-- User injected custom CSS -->
  <style id="user-custom-css"></style>
</head>
<body>

<div id="app-container">
  <!-- LEFT RAIL: Navigation (Discord/VK Hybrid) -->
  <div class="vk-rail">
    <button class="rail-btn active" title="Мессенджер" onclick="switchTab('chats')">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 3C6.477 3 2 6.979 2 11.889c0 2.825 1.502 5.342 3.86 7.001-.176.883-.756 2.457-2.091 3.493 0 0 2.922 0 5.253-1.637.951.26 1.948.403 2.978.403 5.523 0 10-3.979 10-8.889C22 6.979 17.523 3 12 3z"/></svg>
    </button>
    <button class="rail-btn" title="Избранное" onclick="openFavorites()">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
    </button>
    <button class="rail-btn" title="Эмодзи и Стикеры" onclick="toggleModal('emoji-modal')">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
    </button>
    <button class="rail-btn" title="Настройки / Nitro & Premium" onclick="toggleModal('settings-modal')">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
  </div>

  <!-- MIDDLE PANEL: Chats List & Global Search -->
  <div class="vk-sidebar">
    <div class="sidebar-header">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="global-search" placeholder="Поиск (юзеры, чаты)..." oninput="handleSearch(this.value)">
      </div>
    </div>
    <div class="chat-list" id="chat-list-container">
      <!-- Populated dynamically -->
    </div>
  </div>

  <!-- RIGHT PANEL: Active Chat -->
  <div class="vk-chat-window">
    <div class="chat-header">
      <div class="chat-header-user" id="current-chat-header">
        <span class="chat-name">Выберите чат</span>
      </div>
    </div>

    <div class="chat-messages" id="chat-messages-container">
      <!-- Messages appear here -->
    </div>

    <!-- Chat Input Bar -->
    <div class="chat-input-area">
      <label class="action-btn" title="Прикрепить фото / файл">
        <input type="file" id="file-input" style="display:none" onchange="handleFileUpload(event)">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4s-4 1.79-4 4v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
      </label>

      <!-- Toggle Sticker Sending Mode -->
      <label style="display:flex; align-items:center; gap:4px; font-size:12px; color:var(--vk-text-secondary); cursor:pointer;">
        <input type="checkbox" id="sticker-mode-toggle"> Стикер
      </label>

      <div class="input-wrapper">
        <input type="text" id="message-input" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
      </div>

      <button class="action-btn" onclick="sendMessage()" title="Отправить">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- MODAL 1: SETTINGS & CUSTOM CSS & PROFILE -->
<div class="panel-overlay" id="settings-modal">
  <div class="panel-card">
    <div class="panel-header">
      <span>Настройки профиля & VK Nitro</span>
      <button class="action-btn" onclick="toggleModal('settings-modal')">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="panel-body">
      <!-- Profile Customization -->
      <div class="profile-banner-preview" id="preview-banner">
        <img src="" id="preview-avatar" class="profile-avatar-preview" alt="Avatar">
      </div>

      <label>Никнейм:</label>
      <input type="text" id="setting-username" style="padding:8px; border-radius:6px; border:1px solid var(--vk-border);">

      <label>Кастомный эмодзи/GIF в нике (URL):</label>
      <input type="text" id="setting-status-emoji" placeholder="https://.../gif_100x100.gif" style="padding:8px; border-radius:6px; border:1px solid var(--vk-border);">

      <label>URL Аватарки (GIF / PNG):</label>
      <input type="text" id="setting-avatar-url" placeholder="https://..." style="padding:8px; border-radius:6px; border:1px solid var(--vk-border);">

      <label>Цвет баннера / Градиент профиля:</label>
      <input type="text" id="setting-banner-color" placeholder="linear-gradient(135deg, #0077ff, #ff007f)" style="padding:8px; border-radius:6px; border:1px solid var(--vk-border);">

      <label>Обои чата (WhatsApp стиль / Ссылка / Файл):</label>
      <input type="file" accept="image/*" onchange="uploadLocalWallpaper(event)">

      <hr style="border:none; border-top:1px solid var(--vk-border); margin:8px 0;">

      <!-- Custom CSS Editor -->
      <label>Редактор локального CSS (сохраняется у вас):</label>
      <textarea id="setting-custom-css" class="css-editor" placeholder="/* Напишите ваш CSS код тут */&#10;body { --vk-blue: #ff0055; }"></textarea>

      <button onclick="saveSettings()" style="padding:10px; background:var(--vk-blue); color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600;">Сохранить настройки</button>
    </div>
  </div>
</div>

<!-- MODAL 2: EMOJI & STICKER PACKS -->
<div class="panel-overlay" id="emoji-modal">
  <div class="panel-card">
    <div class="panel-header">
      <span>Открытые Эмодзи и Стикер-паки</span>
      <button class="action-btn" onclick="toggleModal('emoji-modal')">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="panel-body" id="emoji-packs-container">
      <!-- Dynamic Packs Loaded Here -->
    </div>
  </div>
</div>

<script>
/* --- CORE STATE MANAGEMENT (JSON STORAGE) --- */
let DB = {
  users: JSON.parse(localStorage.getItem('vk_users')) || [],
  messages: JSON.parse(localStorage.getItem('vk_messages')) || {},
  currentUser: JSON.parse(localStorage.getItem('vk_current_user')) || null,
  activeChatId: 'favorites',
  emojiPacks: []
};

// SVG Durov Verification Badge
const DUROV_VERIFIED_SVG = `<svg class="verified-badge" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`;

// Initialize Application
window.addEventListener('DOMContentLoaded', () => {
  initUserSession();
  loadCustomCSS();
  loadWallpaper();
  renderChatList();
  renderActiveChat();
  loadEmojiPacks();
});

/* --- AUTH & USER SEEDING --- */
function initUserSession() {
  if (DB.users.length === 0) {
    // First Registered User -> Gets Telegram/Durov Badge!
    const durovUser = {
      id: 'user_1',
      username: 'Pavel_Durov',
      avatar: 'https://i.imgur.com/7k12EPD.jpeg',
      isVerified: true, // First user checkmark!
      statusEmoji: 'https://i.imgur.com/wP01Z9p.gif',
      customBanner: 'linear-gradient(135deg, #0077ff, #00d2ff)'
    };
    DB.users.push(durovUser);
    DB.currentUser = durovUser;
    saveDB();
  } else if (!DB.currentUser) {
    DB.currentUser = DB.users[0];
  }
}

function saveDB() {
  localStorage.setItem('vk_users', JSON.stringify(DB.users));
  localStorage.setItem('vk_messages', JSON.stringify(DB.messages));
  localStorage.setItem('vk_current_user', JSON.stringify(DB.currentUser));
}

/* --- SEARCH ENGINE (FUZZY / PARTIAL MATCH) --- */
function handleSearch(query) {
  const cleanQuery = query.toLowerCase().trim();
  renderChatList(cleanQuery);
}

function renderChatList(filter = '') {
  const container = document.getElementById('chat-list-container');
  container.innerHTML = '';

  // 1. Always Render Favorites ("Избранное")
  const favActive = DB.activeChatId === 'favorites' ? 'active' : '';
  container.innerHTML += `
    <div class="chat-item ${favActive}" onclick="selectChat('favorites')">
      <div class="avatar-wrapper">
        <div style="width:100%; height:100%; background:var(--vk-blue); border-radius:50%; display:flex; align-items:center; justify-content:center; fill:#fff;">
          <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </div>
      </div>
      <div class="chat-info">
        <div class="chat-name-row"><span class="chat-name">Избранное</span></div>
        <div class="chat-last-msg">Сохраненные сообщения</div>
      </div>
    </div>
  `;

  // 2. Global Users Search
  DB.users.forEach(user => {
    if (user.id === DB.currentUser.id) return; // Skip self
    if (filter && !user.username.toLowerCase().includes(filter)) return;

    const isActive = DB.activeChatId === user.id ? 'active' : '';
    const badge = user.isVerified ? DUROV_VERIFIED_SVG : '';
    const statusIcon = user.statusEmoji ? `<img src="${user.statusEmoji}" class="custom-status-icon">` : '';

    container.innerHTML += `
      <div class="chat-item ${isActive}" onclick="selectChat('${user.id}')">
        <div class="avatar-wrapper">
          <img src="${user.avatar || 'https://via.placeholder.com/44'}" alt="Avatar">
          <div class="status-indicator"></div>
        </div>
        <div class="chat-info">
          <div class="chat-name-row">
            <span class="chat-name">${user.username}</span>
            ${badge}
            ${statusIcon}
          </div>
          <div class="chat-last-msg">Нажмите чтобы открыть чат</div>
        </div>
      </div>
    `;
  });
}

/* --- CHAT SYSTEM --- */
function selectChat(id) {
  DB.activeChatId = id;
  renderChatList();
  renderActiveChat();
}

function openFavorites() {
  selectChat('favorites');
}

function renderActiveChat() {
  const headerContainer = document.getElementById('current-chat-header');
  const messagesContainer = document.getElementById('chat-messages-container');
  messagesContainer.innerHTML = '';

  if (DB.activeChatId === 'favorites') {
    headerContainer.innerHTML = `<span class="chat-name">Избранное</span>`;
  } else {
    const targetUser = DB.users.find(u => u.id === DB.activeChatId);
    if (targetUser) {
      const badge = targetUser.isVerified ? DUROV_VERIFIED_SVG : '';
      headerContainer.innerHTML = `
        <img src="${targetUser.avatar}" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">
        <span class="chat-name">${targetUser.username}</span>
        ${badge}
      `;
    }
  }

  // Load Messages
  const chatKey = getChatKey();
  const msgs = DB.messages[chatKey] || [];

  msgs.forEach(msg => {
    const isOutgoing = msg.senderId === DB.currentUser.id;
    const bubbleClass = isOutgoing ? 'outgoing' : 'incoming';
    const stickerClass = msg.isSticker ? 'sticker' : '';

    let contentHtml = msg.text;
    if (msg.mediaUrl) {
      contentHtml += `<img src="${msg.mediaUrl}" class="message-media">`;
    }

    messagesContainer.innerHTML += `
      <div class="message-bubble ${bubbleClass} ${stickerClass}">
        ${contentHtml}
      </div>
    `;
  });

  messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function getChatKey() {
  if (DB.activeChatId === 'favorites') return `fav_${DB.currentUser.id}`;
  return [DB.currentUser.id, DB.activeChatId].sort().join('_');
}

function sendMessage(customMedia = null, isSticker = false) {
  const input = document.getElementById('message-input');
  const isStickerChecked = document.getElementById('sticker-mode-toggle').checked || isSticker;
  const text = input.value.trim();

  if (!text && !customMedia) return;

  const chatKey = getChatKey();
  if (!DB.messages[chatKey]) DB.messages[chatKey] = [];

  DB.messages[chatKey].push({
    senderId: DB.currentUser.id,
    text: text,
    mediaUrl: customMedia,
    isSticker: isStickerChecked,
    timestamp: Date.now()
  });

  saveDB();
  input.value = '';
  document.getElementById('sticker-mode-toggle').checked = false;
  renderActiveChat();
}

/* --- MEDIA & STICKERS --- */
function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const isSticker = document.getElementById('sticker-mode-toggle').checked;
    sendMessage(e.target.result, isSticker);
  };
  reader.readAsDataURL(file);
}

/* --- SETTINGS & LOCAL CSS EDITING --- */
function toggleModal(id) {
  const modal = document.getElementById(id);
  modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';

  if (id === 'settings-modal' && DB.currentUser) {
    document.getElementById('setting-username').value = DB.currentUser.username || '';
    document.getElementById('setting-status-emoji').value = DB.currentUser.statusEmoji || '';
    document.getElementById('setting-avatar-url').value = DB.currentUser.avatar || '';
    document.getElementById('setting-banner-color').value = DB.currentUser.customBanner || '';
    document.getElementById('preview-avatar').src = DB.currentUser.avatar || '';
    document.getElementById('preview-banner').style.background = DB.currentUser.customBanner || 'var(--vk-blue)';
    document.getElementById('setting-custom-css').value = localStorage.getItem('user_custom_css') || '';
  }
}

function saveSettings() {
  DB.currentUser.username = document.getElementById('setting-username').value;
  DB.currentUser.statusEmoji = document.getElementById('setting-status-emoji').value;
  DB.currentUser.avatar = document.getElementById('setting-avatar-url').value;
  DB.currentUser.customBanner = document.getElementById('setting-banner-color').value;

  const cssCode = document.getElementById('setting-custom-css').value;
  localStorage.setItem('user_custom_css', cssCode);
  loadCustomCSS();

  saveDB();
  renderChatList();
  renderActiveChat();
  toggleModal('settings-modal');
}

function loadCustomCSS() {
  const css = localStorage.getItem('user_custom_css');
  if (css) {
    document.getElementById('user-custom-css').innerText = css;
  }
}

function uploadLocalWallpaper(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    localStorage.setItem('chat_wallpaper', e.target.result);
    loadWallpaper();
  };
  reader.readAsDataURL(file);
}

function loadWallpaper() {
  const wp = localStorage.getItem('chat_wallpaper');
  if (wp) {
    document.getElementById('chat-messages-container').style.backgroundImage = `url('${wp}')`;
  }
}

/* --- EMOJI & STICKER PACKS (JSON SCHEMA) --- */
function loadEmojiPacks() {
  // Demo external sticker / emoji JSON configuration
  fetch('emojis.json')
    .then(res => res.json())
    .then(data => {
      DB.emojiPacks = data.packs || [];
      renderEmojiPacks();
    })
    .catch(() => {
      // Fallback local open pack
      DB.emojiPacks = [{
        name: "VK Official Pack",
        items: [
          { code: ":vk:", url: "https://vk.com/favicon.ico" }
        ]
      }];
      renderEmojiPacks();
    });
}

function renderEmojiPacks() {
  const container = document.getElementById('emoji-packs-container');
  container.innerHTML = '';

  DB.emojiPacks.forEach(pack => {
    let itemsHtml = pack.items.map(item => `
      <img src="${item.url}" title="${item.code}" style="width:36px; height:36px; cursor:pointer;" onclick="insertEmoji('${item.url}')">
    `).join('');

    container.innerHTML += `
      <div style="border:1px solid var(--vk-border); border-radius:8px; padding:10px;">
        <div style="font-weight:600; margin-bottom:8px;">${pack.name}</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">${itemsHtml}</div>
      </div>
    `;
  });
}

function insertEmoji(url) {
  const input = document.getElementById('message-input');
  sendMessage(`<img src="${url}" class="inline-emoji">`);
  toggleModal('emoji-modal');
}
</script>
